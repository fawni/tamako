[package]
name = "tamako"
version = "1.1.1"
description = "Cozy anonymous whispers"
authors = ["fawn <fawn@envs.net>"]
repository = "https://codeberg.org/fawn/tamako"
license = "OSL-3.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }

actix-web = "4.11.0"
actix-files = "0.6.6"
actix-governor = "0.8.0"
actix-logger = "0.4.1"

askama = { version = "0.14.0" }
askama_web = { version = "0.14.6", features = ["actix-web-4"] }

sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls"] }

serde = { version = "1.0.219", features = ["derive"] }
twink = { version = "1.1.3", features = ["12-hour", "log"] }
log = "0.4.27"
eyre = { version = "0.6.12" }
dotenvy = "0.15.7"

chrono = "0.4.41"
chrono-tz = "0.10.4"

webhook = "2.1.2"
rs-snowflake = "0.6.0"
once_cell = "1.21.3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev.package.backtrace]
opt-level = 3
